    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Click Tu Boda — Tu web de boda única desde 35€" />

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Click Tu Boda",
      "url": "https://clicktuboda.com",
      "description": "Crea una experiencia digital inmersiva para tu boda con playlist, fotos, RSVP, mapa, agenda y mucho más. Pago único desde 35€.",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "35",
        "highPrice": "65",
        "priceCurrency": "EUR",
        "offerCount": "2"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "47",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Click Tu Boda",
      "url": "https://clicktuboda.com",
      "logo": "https://clicktuboda.com/favicon.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "joseluisitograu@gmail.com",
        "contactType": "customer service",
        "availableLanguage": ["Spanish", "English"]
      }
    }
    </script>

    <!-- JSON-LD: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Es un pago único o una suscripción?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pago único. Pagas una sola vez y tu web de boda es tuya para siempre. Sin renovaciones ni cargos ocultos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo ver mi web antes de pagar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Puedes registrarte gratis y explorar todas las demos en vivo. Solo pagas cuando quieras crear tu propia boda."
          }
        },
        {
          "@type": "Question",
          "name": "¿Mis invitados necesitan registrarse?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Tus invitados acceden directamente con el enlace o QR. No necesitan cuenta ni descargar nada."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto tarda en estar lista?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puedes tener tu página lista en minutos. Si eliges que te hagamos un borrador, lo tienes en 24 horas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Y si no me convence?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tienes 30 días de garantía de devolución sin preguntas. Solicita tu reembolso y te devolvemos el 100%."
          }
        }
      ]
    }
    </script>

    <!-- Preload hero font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>

  </body>
